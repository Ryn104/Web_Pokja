<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - PointKu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #101c42 0%, #080d20 55%, #040610 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(17, 26, 51, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(47, 107, 242, 0.15);
        }
        .glass-input {
            background: rgba(10, 17, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transition: all 0.25s ease;
        }
        .glass-input:focus {
            background: rgba(13, 22, 48, 0.85);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-glow {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .btn-glow:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 12px 30px -5px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }
        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Ambient Background Glows -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/15 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-[300px] h-[300px] bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md animate-fade-in relative z-10">
        <!-- Back Button -->
        <a href="/" class="inline-flex items-center text-slate-400 hover:text-white mb-6 transition font-medium text-sm group">
            <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> Kembali ke Beranda
        </a>
        
        <!-- Glass Card Form -->
        <div class="glass-card rounded-3xl p-8 sm:p-10 relative overflow-hidden">
            <!-- Subtle Top Highlight Line -->
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-blue-400/50 to-transparent"></div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-white/95 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20 p-2.5 border border-white/20 hover:scale-105 transition-transform duration-300">
                    <img src="assets/logo.png" alt="HMIF Logo" class="h-full w-full object-contain">
                </div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Login Admin</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1.5">Masuk untuk mengelola point mahasiswa</p>
            </div>

            <!-- Alert -->
            <div id="alertBox" class="hidden mb-4 p-4 rounded-xl text-sm font-medium border border-white/10"></div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        <i class="fas fa-envelope mr-1.5 text-blue-400"></i> Email
                    </label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3.5 glass-input rounded-xl outline-none text-sm placeholder-slate-500"
                        placeholder="admin@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        <i class="fas fa-lock mr-1.5 text-blue-400"></i> Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password" required
                            class="w-full px-4 py-3.5 glass-input rounded-xl outline-none text-sm placeholder-slate-500 pr-12"
                            placeholder="Masukkan password">
                        <button type="button" onclick="togglePassword()" 
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="loginBtn"
                    class="w-full btn-glow text-white py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center space-x-2 transition mt-2">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Masuk</span>
                </button>
            </form>
        </div>
        
        <p class="text-center text-slate-400 text-xs mt-6 flex items-center justify-center">
            <i class="fas fa-shield-alt mr-1.5 text-blue-400"></i> Hanya admin yang bisa mengakses halaman ini
        </p>
    </div>

    <script src="js/env.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
